name: Daily Theatre Pipeline

on:
  schedule:
    # 20:00 UTC = 6am AEST / 7am AEDT. The pipeline itself works in
    # Australia/Sydney time, so the exact runner hour does not matter.
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never let a manual dispatch race the scheduled run into the same branch.
concurrency:
  group: theatre-pipeline
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v

  pipeline:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json docs/data.json docs/data-current.json docs/theatres.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update theatre data $(TZ=Australia/Sydney date +%Y-%m-%d)"
          # Retry against a moved main rather than failing the whole run.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, rebasing (attempt $attempt)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
          echo "Could not push after 3 attempts" >&2
          exit 1
